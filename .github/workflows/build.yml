# ==============================================================================
# MatrixTracker Build & Test CI/CD Workflow
# ==============================================================================
# 🔐 Keystore Persistence Setup Instructions:
# To prevent "App not installed" update failures caused by signature mismatches,
# do NOT dynamically generate a new keystore on every CI run.
#
# Follow these 3 steps ONCE to set up a persistent release signing key:
#
# Step 1: Generate a release keystore locally on your developer machine:
#   keytool -genkeypair -v -keystore release.keystore -alias matrixreleasekey \
#     -keyalg RSA -keysize 2048 -validity 10000 -storepass YourPassword123 -keypass YourPassword123
#
# Step 2: Encode the keystore to Base64 format:
#   - Linux/macOS:
#       base64 -w 0 release.keystore > keystore_base64.txt
#   - Windows PowerShell:
#       [Convert]::ToBase64String([IO.File]::ReadAllBytes("release.keystore")) > keystore_base64.txt
#
# Step 3: Add the following Repository Secrets in GitHub:
#   GitHub Repo -> Settings -> Secrets and variables -> Actions -> New repository secret:
#     - RELEASE_KEYSTORE_BASE64   : Paste content of keystore_base64.txt
#     - RELEASE_KEYSTORE_PASSWORD : YourPassword123
#     - RELEASE_KEY_ALIAS        : matrixreleasekey
#     - RELEASE_KEY_PASSWORD     : YourPassword123
# ==============================================================================

name: Build & Test MatrixTracker

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/release.keystore
            echo "✅ Persistent release keystore successfully unpacked."
          else
            echo "⚠️ RELEASE_KEYSTORE_BASE64 / KEYSTORE_BASE64 secret is not set."
            echo "   A persistent keystore should be uploaded to GitHub Secrets to ensure identical APK signatures across builds."
          fi

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Release APK
        env:
          KEYSTORE_FILE: /home/runner/.android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatrixTracker-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          name: MatrixTracker ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
